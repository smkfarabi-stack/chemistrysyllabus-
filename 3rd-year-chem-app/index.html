<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>3rd Year Chemistry Resource System</title>

  <link rel="stylesheet" href="css/styles.css">

  <style>
    /* =========================================================
       CREATOR CARD — BOTTOM LEFT
       ========================================================= */

    .creator-card {
      position: fixed;
      left: 24px;
      bottom: 24px;
      z-index: 9999;

      width: 245px;
      padding: 14px 16px;

      background: rgba(8, 18, 28, 0.78);
      border: 1px solid rgba(0, 247, 255, 0.28);
      border-radius: 16px;

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);

      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.35),
        0 0 20px rgba(0, 247, 255, 0.06);

      color: #ffffff;

      transition:
        transform 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease;
    }

    .creator-card:hover {
      transform: translateY(-4px);

      border-color: rgba(0, 247, 255, 0.55);

      box-shadow:
        0 14px 40px rgba(0, 0, 0, 0.45),
        0 0 25px rgba(0, 247, 255, 0.12);
    }

    .creator-label {
      display: block;

      margin-bottom: 3px;

      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;

      color: #00f7ff;
    }

    .creator-name {
      margin: 0;

      font-size: 17px;
      font-weight: 700;

      color: #ffffff;
    }

    .creator-project {
      margin: 4px 0 11px;

      font-size: 11px;
      line-height: 1.4;

      color: rgba(255, 255, 255, 0.62);
    }

    .creator-portfolio {
      display: inline-flex;
      align-items: center;
      gap: 6px;

      padding: 6px 10px;

      border: 1px solid rgba(0, 247, 255, 0.28);
      border-radius: 8px;

      background: rgba(0, 247, 255, 0.07);

      color: #00f7ff;
      text-decoration: none;

      font-size: 11px;
      font-weight: 600;

      transition:
        background 0.2s ease,
        border-color 0.2s ease;
    }

    .creator-portfolio:hover {
      background: rgba(0, 247, 255, 0.14);
      border-color: rgba(0, 247, 255, 0.55);
    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 600px) {
      .creator-card {
        left: 12px;
        bottom: 12px;

        width: auto;
        max-width: 220px;

        padding: 11px 13px;
      }

      .creator-name {
        font-size: 15px;
      }

      .creator-project {
        margin-bottom: 8px;
        font-size: 10px;
      }

      .creator-portfolio {
        padding: 5px 8px;
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

  <!-- =======================================================
       LOADING SCREEN
       ======================================================= -->

  <div id="loader-overlay">

    <div class="flask-container">

      <div class="flask">

        <div class="liquid"></div>

        <div
          class="bubble"
          style="
            left: 20%;
            width: 8px;
            height: 8px;
            animation-delay: 0s;
          "
        ></div>

        <div
          class="bubble"
          style="
            left: 50%;
            width: 12px;
            height: 12px;
            animation-delay: 0.4s;
          "
        ></div>

        <div
          class="bubble"
          style="
            left: 70%;
            width: 6px;
            height: 6px;
            animation-delay: 0.8s;
          "
        ></div>

      </div>

    </div>

    <p
      style="
        margin-top: 16px;
        color: var(--aqua-cyan);
        font-weight: 600;
      "
    >
      Loading Catalyst...
    </p>

  </div>


  <!-- =======================================================
       CREATOR INFORMATION
       FIXED AT BOTTOM LEFT
       ======================================================= -->

  <section class="creator-card">

    <span class="creator-label">
      Created by
    </span>

    <h2 class="creator-name">
      Farabi · Chemistry 53
    </h2>

    <p class="creator-project">
      3rd Year Chemistry Resource System
    </p>

    <a
      class="creator-portfolio"
      href="https://smkfarabi-stack.github.io/my-portfolio/"
      target="_blank"
      rel="noopener noreferrer"
    >
      ↗ View Portfolio
    </a>

  </section>


  <!-- =======================================================
       MAIN APPLICATION
       ======================================================= -->

  <main
    id="app-root"
    style="
      padding: 32px;
      max-width: 1200px;
      margin: 0 auto;
    "
  ></main>


  <!-- =======================================================
       JAVASCRIPT
       ======================================================= -->

  <script src="js/syllabus-data.js"></script>

  <script src="js/resources.js"></script>

  <script src="js/code-generator.js"></script>

  <script src="js/app.js"></script>

</body>
</html>
