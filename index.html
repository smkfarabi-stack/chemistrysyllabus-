<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>3rd Year Chemistry Resource System</title>

  <link rel="stylesheet" href="css/styles.css">

  <style>
    /* =========================================================
       BOTTOM-LEFT ADMIN / CREATOR PANEL
       ========================================================= */

    .bottom-left-panel {
      position: fixed;
      left: 24px;
      bottom: 24px;
      z-index: 9999;

      width: 270px;

      display: flex;
      flex-direction: column;
      gap: 10px;
    }


    /* =========================================================
       ADMIN WARNING
       ========================================================= */

    .admin-warning {
      padding: 9px 12px;

      background: rgba(120, 55, 0, 0.22);

      border: 1px solid rgba(255, 180, 60, 0.35);
      border-radius: 10px;

      color: rgba(255, 220, 160, 0.9);

      font-size: 10px;
      line-height: 1.45;

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.25);
    }

    .admin-warning strong {
      display: block;

      margin-bottom: 2px;

      color: #ffc76b;

      font-size: 10px;
      letter-spacing: 0.4px;
    }


    /* =========================================================
       ADD RESOURCE BUTTON
       ========================================================= */

    .add-resource-btn {
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      padding: 11px 14px;

      border: 1px solid rgba(0, 247, 255, 0.4);
      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          rgba(0, 247, 255, 0.13),
          rgba(120, 0, 255, 0.13)
        );

      color: #00f7ff;

      text-decoration: none;

      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.3px;

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);

      box-shadow:
        0 8px 28px rgba(0, 0, 0, 0.3),
        0 0 18px rgba(0, 247, 255, 0.05);

      transition:
        transform 0.25s ease,
        border-color 0.25s ease,
        background 0.25s ease,
        box-shadow 0.25s ease;
    }

    .add-resource-btn:hover {
      transform: translateY(-3px);

      border-color: rgba(0, 247, 255, 0.75);

      background:
        linear-gradient(
          135deg,
          rgba(0, 247, 255, 0.2),
          rgba(120, 0, 255, 0.2)
        );

      box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.4),
        0 0 25px rgba(0, 247, 255, 0.12);
    }

    .add-resource-icon {
      font-size: 15px;
      line-height: 1;
    }


    /* =========================================================
       CREATOR CARD
       ========================================================= */

    .creator-card {
      width: 100%;
      box-sizing: border-box;

      padding: 14px 16px;

      background: rgba(8, 18, 28, 0.78);

      border: 1px solid rgba(0, 247, 255, 0.28);
      border-radius: 16px;

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);

      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.35),
        0 0 20px rgba(0, 247, 255, 0.06);

      color: #ffffff;

      transition:
        transform 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease;
    }

    .creator-card:hover {
      transform: translateY(-3px);

      border-color: rgba(0, 247, 255, 0.55);

      box-shadow:
        0 14px 40px rgba(0, 0, 0, 0.45),
        0 0 25px rgba(0, 247, 255, 0.12);
    }

    .creator-label {
      display: block;

      margin-bottom: 3px;

      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;

      color: #00f7ff;
    }

    .creator-name {
      margin: 0;

      font-size: 17px;
      font-weight: 700;

      color: #ffffff;
    }

    .creator-project {
      margin: 4px 0 11px;

      font-size: 11px;
      line-height: 1.4;

      color: rgba(255, 255, 255, 0.62);
    }

    .creator-portfolio {
      display: inline-flex;
      align-items: center;
      gap: 6px;

      padding: 6px 10px;

      border: 1px solid rgba(0, 247, 255, 0.28);
      border-radius: 8px;

      background: rgba(0, 247, 255, 0.07);

      color: #00f7ff;

      text-decoration: none;

      font-size: 11px;
      font-weight: 600;

      transition:
        background 0.2s ease,
        border-color 0.2s ease;
    }

    .creator-portfolio:hover {
      background: rgba(0, 247, 255, 0.14);

      border-color: rgba(0, 247, 255, 0.55);
    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 600px) {

      .bottom-left-panel {
        left: 12px;
        bottom: 12px;

        width: 230px;
      }

      .admin-warning {
        padding: 8px 10px;
        font-size: 9px;
      }

      .add-resource-btn {
        padding: 9px 11px;
        font-size: 11px;
      }

      .creator-card {
        padding: 11px 13px;
      }

      .creator-name {
        font-size: 15px;
      }

      .creator-project {
        margin-bottom: 8px;
        font-size: 10px;
      }

      .creator-portfolio {
        padding: 5px 8px;
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

  <!-- =======================================================
       LOADING SCREEN
       ======================================================= -->

  <div id="loader-overlay">

    <div class="flask-container">

      <div class="flask">

        <div class="liquid"></div>

        <div
          class="bubble"
          style="
            left: 20%;
            width: 8px;
            height: 8px;
            animation-delay: 0s;
          "
        ></div>

        <div
          class="bubble"
          style="
            left: 50%;
            width: 12px;
            height: 12px;
            animation-delay: 0.4s;
          "
        ></div>

        <div
          class="bubble"
          style="
            left: 70%;
            width: 6px;
            height: 6px;
            animation-delay: 0.8s;
          "
        ></div>

      </div>

    </div>

    <p
      style="
        margin-top: 16px;
        color: var(--aqua-cyan);
        font-weight: 600;
      "
    >
      Loading Catalyst...
    </p>

  </div>


  <!-- =======================================================
       BOTTOM-LEFT PANEL
       ======================================================= -->

  <div class="bottom-left-panel">

    <!-- ADMIN WARNING -->

    <div class="admin-warning">

      <strong>
        ⚠ Admin Access Only
      </strong>

      Only Admins are allowed to add resources to the
      Chemistry Resource System.

    </div>


    <!-- ADD RESOURCE BUTTON -->

    <a
      href="code-generator.html"
      class="add-resource-btn"
    >

      <span class="add-resource-icon">
        ＋
      </span>

      <span>
        Add Resource
      </span>

    </a>


    <!-- CREATOR INFORMATION -->

    <section class="creator-card">

      <span class="creator-label">
        Created by
      </span>

      <h2 class="creator-name">
        Farabi · Chemistry 53
      </h2>

      <p class="creator-project">
        3rd Year Chemistry Resource System
      </p>

      <a
        class="creator-portfolio"
        href="https://smkfarabi-stack.github.io/my-portfolio/"
        target="_blank"
        rel="noopener noreferrer"
      >
        ↗ View Portfolio
      </a>

    </section>

  </div>


  <!-- =======================================================
       MAIN APPLICATION
       ======================================================= -->

  <main
    id="app-root"
    style="
      padding: 32px;
      max-width: 1200px;
      margin: 0 auto;
    "
  ></main>


  <!-- =======================================================
       JAVASCRIPT
       ======================================================= -->

  <script src="js/syllabus-data.js"></script>

  <script src="js/resources.js"></script>

  <script src="js/code-generator.js"></script>

  <script src="js/app.js"></script>

</body>
</html>
